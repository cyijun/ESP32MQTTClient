name: Arduino and host CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host_tests:
    name: Host behavior tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run host tests
        run: bash tests/run_host_tests.sh

  arduino_compile:
    name: Arduino ESP32 ${{ matrix.esp32_core }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        esp32_core:
          - 2.0.17
          - 3.3.11

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@7ef629dcdf0f458ab7ae83149d629443deac6eac # v2.0.0
        with:
          version: 1.3.1

      - name: Install Arduino ESP32 ${{ matrix.esp32_core }}
        env:
          ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls "$ESP32_INDEX_URL"
          arduino-cli core install "esp32:esp32@${{ matrix.esp32_core }}" \
            --additional-urls "$ESP32_INDEX_URL"

      - name: Compile HelloToMyself
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --library "$GITHUB_WORKSPACE" \
            examples/HelloToMyself
